<div
  class="max-w-7xl w-full mx-auto p-6 relative bg-green-50 rounded-xl shadow-lg border border-green-100"
>
  <h2 class="text-2xl font-semibold text-gray-900 mb-6 flex items-center gap-2">
    <span>🔔</span> Notifications
  </h2>

  <!-- Filter by Type Buttons -->
  <div class="flex flex-wrap gap-3 mb-6">
  <button 
    *ngFor="let type of allTypes"
    (click)="filterByType(type)"
    [ngClass]="{
      'bg-green-700 text-white': filteredType === type,
      'bg-white text-green-700 border border-green-300': filteredType !== type
    }"
    class="px-4 py-2 rounded-full text-md font-medium transition-shadow hover:shadow-lg focus:outline-none"
  >
    {{ type }}
  </button>

  <button
    (click)="filterByType('')" 
    [ngClass]="{
      'bg-green-700 text-white': filteredType === '',
      'bg-white text-green-700 border border-green-300': filteredType !== ''
    }"
    class="px-4 py-2 rounded-full text-md font-medium transition-shadow hover:shadow-lg focus:outline-none"
  >
    All
  </button>
</div>

  <!-- No notifications message -->
  <div *ngIf="filteredNotifications.length === 0" class="text-center text-gray-500 italic py-10">
    No notifications to show. ✨
  </div>

  <!-- Notification list -->
  <ul class="space-y-5" *ngIf="filteredNotifications.length > 0">
    <li
      *ngFor="let notif of filteredNotifications; trackBy: trackById"
      class="p-5 bg-green-100 border border-green-300 rounded-lg shadow-sm hover:shadow-md transition flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4"
    >
      <div class="flex items-center gap-4">
        <div class="flex-shrink-0">
          <span 
            class="inline-block w-10 h-10 rounded-full bg-green-300 text-green-900 flex items-center justify-center text-xl font-bold"
            >🔔</span
          >
        </div>
        <div>
          <p class="text-black font-semibold text-lg capitalize mb-1">
            {{ notif.type }}
          </p>
          <p class="text-black">{{ notif.message }}</p>
          <p class="text-sm text-gray-600 italic mt-1">
            {{ notif.createdAt | date: 'short' }}
          </p>
        </div>
      </div>

      <div *ngIf="notif.relatedItemId" class="text-right mt-3 sm:mt-0">
        <button
          class="bg-green-700 hover:bg-green-800 text-white px-4 py-2 rounded-md text-sm font-semibold shadow transition"
          (click)="viewRelated(notif.relatedItemId)"
        >
          View Related
        </button>
      </div>
    </li>
  </ul>

  <!-- Pagination -->
  <div class="mt-8 flex justify-center">
    <mat-paginator
      [length]="total"
      [pageSize]="currentSize"
      [pageIndex]="currentPage - 1"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="pageChanged($event)"
    >
    </mat-paginator>
  </div>
</div>
