<div class="max-w-7xl w-full mx-auto p-6 bg-green-50 rounded-xl shadow-lg border border-green-100">
  <div class="max-w-4xl w-full mx-auto p-0 relative rounded-xl shadow-xl border border-green-200 bg-white overflow-hidden">
    <!-- Banner / Cover Image -->
    <div class="h-64 bg-gradient-to-r from-green-400 to-green-200 flex items-center justify-center relative">
      <img
        src="assets/images/logo/banner.png"
        alt="Banner"
        class="absolute inset-0 w-full h-full object-cover opacity-60 pointer-events-none hidden md:block"
      />
      <img
        src="assets/images/logo/bannermd.png"
        alt="Banner Medium"
        class="absolute inset-0 w-full h-full object-cover opacity-60 pointer-events-none block md:hidden"
      />
    </div>

    <!-- Title -->
    <div class="w-full flex justify-center mt-[-2.5rem] mb-4">
      <h2 class="text-3xl font-bold text-green-900 drop-shadow bg-white px-6 py-2 rounded-xl shadow">
        Edit Profile
      </h2>
    </div>

    <!-- Edit Form Card -->
    <div class="flex flex-col items-center px-6 pb-8">
      <!-- Avatar Selection -->
      <div class="w-32 h-32 rounded-full border-4 border-white shadow-lg bg-green-100 flex items-center justify-center overflow-hidden mb-4">
        <img
          [src]="profileForm.value.avatar "
          alt="Selected Avatar"
          class="w-24 h-24 rounded-full shadow-lg border-4 border-green-300 object-cover"
        />
      </div>
      <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="w-full max-w-xl mx-auto">
     <!-- Name -->
<div class="mb-4">
  <label class="block font-semibold text-green-900">Name</label>
  <input
    type="text"
    formControlName="name"
    class="w-full px-4 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-green-300"
    [ngClass]="{'border-red-500': profileForm.get('name')?.touched && profileForm.get('name')?.invalid}"
  />
  <div *ngIf="profileForm.get('name')?.touched && profileForm.get('name')?.invalid" class="text-red-600 text-sm mt-1">
    <span *ngIf="profileForm.get('name')?.errors?.['required']">Name is required.</span>
    <span *ngIf="profileForm.get('name')?.errors?.['minlength']">Name must be at least 3 characters.</span>
  </div>
</div>

<!-- Email -->
<div class="mb-4">
  <label class="block font-semibold text-green-900">Email</label>
  <input
    type="email"
    formControlName="email"
    class="w-full px-4 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-green-300"
    [ngClass]="{'border-red-500': profileForm.get('email')?.touched && profileForm.get('email')?.invalid}"
  />
  <div *ngIf="profileForm.get('email')?.touched && profileForm.get('email')?.invalid" class="text-red-600 text-sm mt-1">
    <span *ngIf="profileForm.get('email')?.errors?.['required']">Email is required.</span>
    <span *ngIf="profileForm.get('email')?.errors?.['email']">Please enter a valid email address.</span>
  </div>
</div>

<!-- Phone -->
<div class="mb-4">
  <label class="block font-semibold text-green-900">Phone</label>
  <input
    type="tel"
    formControlName="phone"
    class="w-full px-4 py-2 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-green-300"
    [ngClass]="{'border-red-500': profileForm.get('phone')?.touched && profileForm.get('phone')?.invalid}"
  />
  <div *ngIf="profileForm.get('phone')?.touched && profileForm.get('phone')?.invalid" class="text-red-600 text-sm mt-1">
    <span *ngIf="profileForm.get('phone')?.errors?.['required']">Phone is required.</span>
    <span *ngIf="profileForm.get('phone')?.errors?.['pattern']">Phone must be exactly 8 digits.</span>
  </div>
</div>
        <!-- Avatar Selection Grid -->
        <div class="mb-6">
          <label class="block font-semibold text-green-900 mb-3">Select an Avatar</label>
          <div class="grid grid-cols-[repeat(auto-fit,minmax(120px,1fr))] gap-4">
            @for (item of avatars; track $index) {
              <div
                class="flex flex-col items-center cursor-pointer p-3 rounded-xl border-2 transition-all duration-300 ease-in-out shadow-sm hover:shadow-md bg-white"
                [class.border-green-500]="profileForm.value.avatar === item.avatar"
                (click)="selectAvatar(item)"
              >
                <img [src]="item.avatar" [alt]="item.label" class="w-16 h-16 mb-1 object-cover" />
                <span class="text-xs text-green-700 mt-1">{{ item.label }}</span>
              </div>
            }
          </div>
        </div>
        <!-- Buttons -->
        <div class="flex gap-4">
          <button
            type="submit"
            class="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-md transition-all duration-500 ease-in-out shadow disabled:opacity-50 font-semibold text-lg"
            [disabled]="profileForm.invalid"
          >
            💾 Save Changes
          </button>
          <button
            type="button"
            class="flex-1 bg-gray-300 hover:bg-gray-400 text-green-900 py-2 rounded-md transition-all duration-300 shadow font-semibold text-lg"
            (click)="onCancel()"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
