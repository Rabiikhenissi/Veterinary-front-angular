<div class="max-w-7xl w-full mx-auto p-6 bg-green-50 rounded-xl shadow-lg border border-green-100">
  <div class="max-w-4xl w-full mx-auto p-0 relative rounded-xl shadow-xl border border-green-200 bg-white overflow-hidden">
    <!-- Banner / Cover Image -->
    <div class="h-64 bg-gradient-to-r from-green-400 to-green-200 flex items-center justify-center relative">
      <img
        src="assets/images/logo/banner.png"
        alt="Banner"
        class="absolute inset-0 w-full h-full object-cover opacity-60 pointer-events-none hidden md:block"
      />
      <img
        src="assets/images/logo/bannermd.png"
        alt="Banner Medium"
        class="absolute inset-0 w-full h-full object-cover opacity-60 pointer-events-none block md:hidden"
      />
    </div>
    

    <!-- Title -->
    <div class="w-full flex justify-center mt-[-2.5rem] mb-4">
      <h2 class="text-3xl font-bold text-green-900 drop-shadow bg-white px-6 py-2 rounded-xl shadow">
        edit pet 
      </h2>
    </div>

    <div class="flex flex-col items-center px-6 pb-8">
      <form [formGroup]="petForm" (ngSubmit)="onSubmit()" class="w-full max-w-xl mx-auto">
        <!-- Name Field -->
        <div class="mb-6">
          <label class="block font-semibold text-green-700">Name</label>
          <input type="text" formControlName="name" 
                 class="w-full px-4 py-3 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500" />
        <div *ngIf="petForm.get('name')?.touched && petForm.get('name')?.invalid" class="text-red-600 text-sm mt-1">
    <span *ngIf="petForm.get('name')?.errors?.['required']">Name is required.</span>
    <span *ngIf="petForm.get('name')?.errors?.['minlength']">Name must be at least 2 characters.</span>
  </div>
</div>

        <!-- Birth Date Field -->
        <div class="mb-6">
          <label class="block font-semibold text-green-900">Birth Date</label>
          <mat-form-field appearance="outline" class="w-full">
            <input
              matInput
              [matDatepicker]="picker"
              formControlName="birthDate"
              [max]="today"
            />
            <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
        </div>
        
        <!-- Species Selector -->
        <div class="mb-6">
          <label class="block font-semibold text-green-700 mb-2">Select a Species</label>
          <div class="grid grid-cols-[repeat(auto-fit,minmax(120px,1fr))] gap-4">
            @for (item of speciesOptions; track $index) {
              <div
                class="flex flex-col items-center cursor-pointer p-4 rounded-xl border-2 transition-all duration-300 ease-in-out shadow-sm hover:shadow-md bg-white"
                [class.border-green-500]="petForm.value.icon === item.icon"
                (click)="selectIcon(item)"
              >
                <img [src]="item.icon" [alt]="item.label" class="w-16 h-16 mb-2" />
                <span class="text-sm font-medium text-green-700">{{ item.name }}</span>
              </div>
            }
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex gap-4">
          <button type="submit" 
                  class="flex-1 bg-green-500 text-white py-3 rounded-lg hover:bg-green-600 transition-colors duration-300 disabled:opacity-50 font-semibold text-lg" 
                  [disabled]="petForm.invalid">
            💾 Save Changes
          </button>
          <button
            type="button"
            class="flex-1 bg-gray-300 hover:bg-gray-400 text-green-900 py-3 rounded-lg transition-all duration-300 shadow font-semibold text-lg"
            (click)="onCancel()"
          >
            Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
