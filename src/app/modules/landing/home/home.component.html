<div class="flex flex-col items-center justify-center w-full h-full">
  <div class="w-full">
    <div class="min-h-screen bg-gradient-to-br from-purple-100 via-white to-blue-100">
      <!-- Hero Banner -->
      <div class="w-full text-center py-16 bg-white shadow-md mb-10">
        <h1 class="text-4xl sm:text-5xl font-bold text-indigo-700 mb-4">
          Welcome to Zoovana!
        </h1>
        <p class="text-lg sm:text-xl text-gray-600">
          Discover and connect with amazing veterinary companies 🐾
        </p>
        <a
                class="mt-8"
                mat-flat-button
                [color]="'primary'"
                [routerLink]="'/dashboards/project'">
                <span>Launch the App</span>
                <mat-icon
                    class="ml-2 icon-size-5"
                    [svgIcon]="'heroicons_mini:arrow-long-right'"></mat-icon>
        </a> 
      </div>

      <!-- Company Cards Grid -->
      <!-- Company Cards Grid -->
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
  <div class="grid gap-8 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
    <div
      *ngFor="let company of companies"
      class="bg-white rounded-2xl shadow-md hover:shadow-indigo-300 transition-all duration-300 border border-gray-200 flex flex-col items-center p-6"
    >
      <!-- Wrap each card with a click event that triggers details() -->
      <div (click)="details(company)" class="flex flex-col items-center cursor-pointer">
        <div class="w-24 h-24 bg-indigo-50 rounded-full flex items-center justify-center mb-4 shadow-sm">
          <img
            [src]="defaultLogo"
            alt="Company Logo"
            class="w-16 h-16 object-contain"
          />
        </div>
        <h2 class="text-indigo-800 text-lg font-semibold">{{ company.name }}</h2>
      </div>
    </div>
  </div>
</div>
    </div>
  </div>
</div>
