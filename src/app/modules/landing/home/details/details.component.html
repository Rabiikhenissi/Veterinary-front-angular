<!-- Hero Banner -->


<div class="flex flex-col md:flex-row gap-24 px-4 sm:px-6 lg:px-8 py-24 bg-white rounded-2xl shadow-2xl w-full text-[150%]">
  
  <!-- Map Section -->
  <div class="md:w-1/2 w-full h-[900px] bg-gray-100 rounded-2xl shadow-inner overflow-hidden">
    <div id="map" class="w-full h-full rounded-lg"></div>
  </div>

  <!-- Company Details Section -->
  <div class="md:w-1/2 w-full flex flex-col gap-12 justify-start">
    
    <!-- Company Name -->
    <h2 class="text-4xl md:text-5xl font-bold text-gray-800">
      {{ company.name }}
    </h2>

    <!-- Address Section -->
    <div class="flex items-center text-xl text-gray-600">
      <span class="font-semibold w-64">{{ 'Address' | transloco }}:</span>
      <span class="ml-4 text-gray-800">{{ address || 'Address not available' }}</span>
    </div>

    <!-- Visit Price -->
    <div class="flex items-center text-xl text-gray-600">
      <span class="font-semibold w-64">{{ 'Visit Price' | transloco }}:</span>
      <span class="ml-4 text-gray-800">${{ company.visitPrice | number:'1.2-2' }}</span>
    </div>

    <!-- Services Section -->
    <div>
      <h3 class="text-2xl md:text-3xl font-semibold text-gray-800 mb-4">{{ 'Services' | transloco }}</h3>
      <ul class="list-disc pl-8 space-y-3">
        <li *ngFor="let service of company.services" class="text-lg text-gray-700">
          <span class="font-medium">{{ service.name }}</span> – ${{ service.price | number:'1.2-2' }}
        </li>
      </ul>
    </div>
    
  </div>
</div>
