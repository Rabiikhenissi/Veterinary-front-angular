<div class="w-full max-w-7xl mx-auto px-10 py-10 bg-green-50 border border-green-100 rounded-3xl shadow-2xl">
    <h2 class="text-4xl font-bold text-green-800 mb-10 text-center">📅 Add Appointment</h2>
  
    <form [formGroup]="appointmentForm" (ngSubmit)="submit()" class="space-y-10">
      <div>
        <label class="block text-xl font-semibold text-green-700 mb-3">Select Client</label>
        <select formControlName="clientId" (change)="onClientSelect($event.target.value)"
                class="w-full border-2 border-green-200 p-4 rounded-xl text-green-900 text-lg shadow-md">
          <option value="">-- Select a client --</option>
          <option *ngFor="let client of clients" [value]="client._id">
            {{ client.name }} - {{ client.email }}
          </option>
        </select>
      </div>
  
    @if(pets.length > 0){  <div >
        <label class="block text-xl font-semibold text-green-700 mb-4">Select a Pet</label>
        <div>
            <label class="block text-lg font-medium text-gray-700 mb-3">Select Animal</label>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
              <div
                *ngFor="let pet of pets"
                (click)="selectPet(pet)"
                class="cursor-pointer border-2 rounded-lg p-4 flex flex-col items-center text-center transition-all duration-200"
                [ngClass]="{
                  'border-green-500 bg-green-50 shadow-lg': selectedPetId === pet._id,
                  'border-gray-200 hover:border-green-300': selectedPetId !== pet._id
                }"
              >
                <img [src]="pet.icon" alt="{{ pet.name }}" class="w-20 h-20 object-cover rounded-full mb-2" />
                <span class="font-medium text-gray-800">{{ pet.name }}</span>
                <span class="text-sm text-gray-500">{{ pet.species }}</span>
              </div>
            </div>
          </div>
      </div>}
  
      <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div>
          <label class="block text-xl font-semibold text-green-700 mb-2">Date</label>
          <input type="date" formControlName="date"
                 class="w-full border-2 p-4 rounded-xl text-lg shadow-md" />
        </div>
        <div>
          <label class="block text-xl font-semibold text-green-700 mb-2">Time</label>
          <input type="time" formControlName="time"
                 class="w-full border-2 p-4 rounded-xl text-lg shadow-md" />
        </div>
      </div>
  
      <div>
        <button type="submit"
                [disabled]="appointmentForm.invalid"
                class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-2xl text-xl font-bold shadow-lg transition-all duration-300">
           Create Appointment
        </button>
      </div>
    </form>
  </div>
