<div
    class="w-full max-w-7xl mx-auto px-10 py-10 bg-green-50 border border-green-100 rounded-3xl shadow-2xl"
>
    <h2 class="text-4xl font-bold text-green-800 mb-10 text-center">
        📅 Add Appointment
    </h2>

    <form
        [formGroup]="appointmentForm"
        (ngSubmit)="submit()"
        class="space-y-10"
        novalidate
    >
        <div>
            <label class="block text-xl font-semibold text-green-700 mb-3"
                >Select Client</label
            >
            <select
                formControlName="clientId"
                (change)="onClientSelect($event.target.value)"
                class="w-full border-2 border-green-200 p-4 rounded-xl text-green-900 text-lg shadow-md"
            >
                <option value="">-- Select a client --</option>
                <option *ngFor="let client of clients" [value]="client._id">
                    {{ client.name }} - {{ client.email }}
                </option>
            </select>
            <div
                *ngIf="
                    appointmentForm.get('clientId')?.invalid &&
                    (appointmentForm.get('clientId')?.touched || isSubmitted)
                "
                class="text-red-600 text-sm mt-2"
            >
                Client is required.
            </div>
        </div>

        <ng-container *ngIf="pets.length > 0 ;else noPets">
            <div>
                <label class="block text-xl font-semibold text-green-700 mb-4"
                    >Select a Pet</label
                >
                <div>
                    <label class="block text-lg font-medium text-gray-700 mb-3"
                        >Select Animal</label
                    >
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div
                            *ngFor="let pet of pets"
                            (click)="selectPet(pet)"
                            class="cursor-pointer border-2 rounded-lg p-4 flex flex-col items-center text-center transition-all duration-200"
                            [ngClass]="{
                                'border-green-500 bg-green-50 shadow-lg':
                                    selectedPetId === pet._id,
                                'border-gray-200 hover:border-green-300':
                                    selectedPetId !== pet._id
                            }"
                        >
                            <img
                                [src]="pet.icon"
                                alt="{{ pet.name }}"
                                class="w-20 h-20 object-cover rounded-full mb-2"
                            />
                            <span class="font-medium text-gray-800">{{
                                pet.name
                            }}</span>
                            <span class="text-sm text-gray-500">{{
                                pet.species
                            }}</span>
                        </div>
                    </div>
                    <div
                        *ngIf="
                            appointmentForm.get('petId')?.invalid &&
                            (appointmentForm.get('petId')?.touched ||
                                isSubmitted)
                        "
                        class="text-red-600 text-sm mt-2"
                    >
                        Please select a pet.
                    </div>
                </div>
            </div>
        </ng-container>
<ng-template #noPets>
    <div class="text-center p-6 bg-red-50 border border-red-200 rounded-lg">
        <p class="text-lg text-red-600 font-semibold mb-4">
            Client has no pets.
        </p>
        <button
            class="bg-green-600 hover:bg-green-700 text-white font-medium py-2 px-4 rounded"
            [routerLink]="['home/clients', clientId, 'pet/add']"
        >
            Add a Pet
        </button>
    </div>
</ng-template>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <label class="block text-xl font-semibold text-green-700 mb-2"
                    >Date</label
                >
                <input
                    type="date"
                    formControlName="date"
                    class="w-full border-2 p-4 rounded-xl text-lg shadow-md"
                />
                <div
                    *ngIf="
                        appointmentForm.get('date')?.invalid &&
                        (appointmentForm.get('date')?.touched || isSubmitted)
                    "
                    class="text-red-600 text-sm mt-2"
                >
                    Date is required.
                </div>
            </div>
            <div>
                <label class="block text-xl font-semibold text-green-700 mb-2"
                    >Time</label
                >
                <select
    formControlName="time"
    class="w-full border-2 border-green-200 p-4 rounded-xl text-green-900 text-lg shadow-md focus:border-green-400 focus:ring-2 focus:ring-green-100 transition duration-200"
>
    <option value="">-- Select time --</option>
    <option *ngFor="let t of allowedTimes" [value]="t">
        {{ t }}
    </option>
</select>
                <div
                    *ngIf="
                        appointmentForm.get('time')?.invalid &&
                        (appointmentForm.get('time')?.touched || isSubmitted)
                    "
                    class="text-red-600 text-sm mt-2"
                >
                    Time is required.
                </div>
                <div
                    *ngIf="outsideBusinessHours"
                    class="text-red-600 text-sm mt-2"
                >
                    Time is outside business hours.
                </div>
            </div>
        </div>

        <div class="flex gap-4 mt-6">
            <button
                type="submit"
                [ngClass]="{
                    'bg-green-700': isSubmitted,
                    'bg-green-600 hover:bg-green-700': !isSubmitted
                }"
                class="flex-1 text-white py-4 rounded-2xl text-xl font-bold active:scale-95 shadow-lg transition-all duration-300 flex items-center justify-center gap-2"
            >
                <span
                    *ngIf="isSubmitted"
                    class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"
                ></span>
                <span>{{
                    isSubmitted ? "Creating..." : "Create Appointment"
                }}</span>
            </button>
            <button
                type="button"
                (click)="cancel()"
                class="flex-1 bg-gray-200 hover:bg-gray-300 text-green-800 py-4 rounded-2xl text-xl font-bold shadow-lg transition-all duration-300"
            >
                Cancel
            </button>
        </div>
    </form>
</div>
