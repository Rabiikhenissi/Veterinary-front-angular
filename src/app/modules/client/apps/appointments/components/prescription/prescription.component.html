<div class="bg-white p-6 rounded-2xl shadow-lg my-8 w-full max-w-4xl mx-auto">
  <h3 class="text-2xl font-bold text-green-700 mb-6 text-center">Prescribed Medications</h3>

  <div>
    <label class="block font-semibold text-green-800 mb-2 text-lg">Prescribed Medications</label>
    <div class="grid grid-cols-1 sm:grid-cols-1 md:grid-cols-1 gap-6">
      <div
        *ngFor="let med of medication"
        class="flex flex-col items-center cursor-pointer p-4 rounded-xl border-2 transition-all duration-300 ease-in-out shadow-sm hover:shadow-md bg-white relative"
        [class.border-green-500]="selectedMedications.includes(med)"
        [class.bg-green-50]="selectedMedications.includes(med)"
        (click)="selectMedication(med)"
      >
        <img [src]="med.image" [alt]="med.name" class="w-16 h-16 mb-2 object-cover rounded-full border border-green-200 shadow" />
        <span class="text-base font-medium text-green-700 mb-1">{{ med.name }}</span>
        <span class="text-xs text-green-500 mb-2">{{ med.price | currency }}</span>

        <!-- Checkmark for selected -->
        <span *ngIf="selectedMedications.includes(med)" class="absolute top-2 right-2 bg-green-500 text-white rounded-full p-1 shadow">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
          </svg>
        </span>

        <!-- Dosage & Instructions for selected ones -->
        <div *ngIf="selectedMedications.includes(med)" class="w-full mt-4 bg-green-50 border border-green-200 rounded-lg p-3" (click)="$event.stopPropagation()">
          <label class="block text-green-700 font-semibold mb-1">Dosage</label>
          <input
            type="text"
            [(ngModel)]="med.dosage"
            placeholder="e.g., 2ml"
            class="mb-3 p-2 border border-green-300 rounded-md w-full focus:ring-2 focus:ring-green-400"
          />
          <label class="block text-green-700 font-semibold mb-1">Instructions</label>
          <input
            type="text"
            [(ngModel)]="med.instructions"
            placeholder="e.g., Twice a day"
            class="p-2 border border-green-300 rounded-md w-full focus:ring-2 focus:ring-green-400"
          />
        </div>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="mt-8 flex flex-wrap gap-4 justify-end">
    <button
      (click)="savePrescription()"
      class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg text-base shadow flex items-center gap-2"
    >
      💾 Save Prescription
    </button>
  </div>
</div>
