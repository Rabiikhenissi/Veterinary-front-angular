<div class="bg-white p-8 rounded-3xl shadow-xl my-10 w-full border border-gray-100">
  <h3 class="text-3xl font-extrabold text-green-800 mb-8 tracking-tight flex items-center gap-3">
    <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M9 17v-2a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v2M9 17H7a4 4 0 0 1-4-4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-2M9 17v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-2"></path>
    </svg>
    Prescribed Medications
  </h3>

  <div *ngIf="medication.length > 0; else noMeds">
    <label class="block font-semibold text-green-900 mb-3 text-lg">Select Medications</label>
    <div class="grid grid-cols-[repeat(auto-fit,minmax(180px,1fr))] gap-8">
      <div
        *ngFor="let med of medication"
        class="flex flex-col items-center cursor-pointer p-5 rounded-2xl border-2 transition-all duration-200 ease-in-out shadow hover:shadow-xl bg-white hover:border-green-400 group relative"
        [class.border-green-600]="selectedMedications.includes(med)"
        [class.border-gray-200]="!selectedMedications.includes(med)"
        (click)="selectMedication(med)"
      >
        <div class="relative mb-2">
          <img [src]="med.imageUrl" [alt]="med.name" class="w-24 h-24 object-cover rounded-xl border border-gray-200 group-hover:scale-105 transition-transform" />
          <span *ngIf="selectedMedications.includes(med)" class="absolute top-1 right-1 bg-green-600 text-white text-xs px-2 py-0.5 rounded-full shadow">✔</span>
        </div>
        <span class="text-base font-semibold text-green-800 mb-1 text-center">{{ med.name }}</span>
        <span class="text-sm text-green-500 mb-2">{{ med.price | currency:'TND':'symbol' }}</span>


        <!-- Checkmark for selected -->
        <span *ngIf="selectedMedications.includes(med)" class="absolute top-2 right-2 bg-green-500 text-white rounded-full p-1 shadow">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
          </svg>
        </span>


        <!-- Dosage & Instructions for selected ones -->
        <div *ngIf="selectedMedications.includes(med)" class="w-full mt-4 bg-green-50 border border-green-200 rounded-lg p-3" (click)="$event.stopPropagation()">
          <label class="block text-green-700 font-semibold mb-1">Dosage</label>
          <input
            type="text"
            [(ngModel)]="med.dosage"
            placeholder="Dosage (e.g., 2ml)"
            class="p-2 border rounded-lg w-full focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none transition"
            [ngClass]="{'border-green-200': med.dosage, 'border-red-400': !med.dosage}"
            (click)="$event.stopPropagation()"
          />
          <div *ngIf="!med.dosage" class="text-xs text-red-500 mt-1">Dosage is required.</div>
          <input
            type="text"
            [(ngModel)]="med.instructions"
            placeholder="Instructions (e.g., Twice a day)"
            class="p-2 border rounded-lg w-full focus:ring-2 focus:ring-green-400 focus:border-green-400 outline-none transition"
            [ngClass]="{'border-green-200': med.instructions, 'border-red-400': !med.instructions}"
            (click)="$event.stopPropagation()"


          />
          <div *ngIf="!med.instructions" class="text-xs text-red-500 mt-1">Instructions are required.</div>
        </div>
      </div>
    </div>
  </div>
  <ng-template #noMeds>
    <div class="flex flex-col items-center justify-center my-12">
      <svg class="w-16 h-16 text-green-400 mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="#f0fdf4"/>
        <path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h4 class="text-2xl font-bold text-green-800 mb-2">No Medications Found</h4>
      <p class="text-green-700 text-base mb-1">There are currently no medications available for this species.</p>
      <p class="text-green-600 text-sm">Please check back the stock.</p>
    </div>
  </ng-template>

  <!-- Action Buttons -->
  <div class="mt-10 flex flex-wrap gap-4 justify-end">
    <button
      (click)="savePrescription()"
      [disabled]="isPrescriptionInvalid()"
      class="bg-green-700 hover:bg-green-800 text-white px-7 py-3 rounded-lg text-base font-semibold shadow-md flex items-center gap-2 transition disabled:opacity-60 disabled:cursor-not-allowed"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M17 16v2a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"></path>
        <polyline points="15 10 20 10 20 15"></polyline>
        <line x1="10" y1="14" x2="20" y2="4"></line>
      </svg>
      Save Prescription

    </button>
  </div>
</div>
