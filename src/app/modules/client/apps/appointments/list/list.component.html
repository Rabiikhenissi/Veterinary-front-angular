<div class="max-w-7xl w-full mx-auto p-6 relative bg-green-50 rounded-xl shadow-lg border border-green-100">
    <h2 class="text-2xl font-bold text-green-800 mb-6 flex items-center gap-2">📅 My Past Appointments</h2>
  
    <ng-container *ngIf="appointments?.length > 0; else noAppointments">
      <ul class="space-y-4">
        <li *ngFor="let appt of appointments" class="p-4 bg-white border border-green-100 rounded-lg shadow-sm hover:shadow-md transition">
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <!-- Pet Info -->
            <div class="flex items-center">
              <img [src]="appt.petId.icon" alt="{{ appt.petId.name }}" class="w-12 h-12 rounded-full border-2 border-green-300 bg-white mr-4">
              <div>
                <p class="font-semibold text-lg text-green-800">{{ appt.petId.name }} ({{ appt.petId.species }})</p>
                <p class="text-sm text-green-700">📅 {{ appt.date | date:'dd/MM/yyyy' }} at 🕒 {{ ('1970-01-01T' + appt.time) |  date:'HH:mm'}}</p>
              </div>
            </div>
  
            
          </div>
        </li>
      </ul><!-- Pagination -->
      <div class="mt-6 flex justify-center">
        <mat-paginator
          [length]="total"
          [pageSize]="currentSize"
          [pageIndex]="currentPage - 1"
          [pageSizeOptions]="[5, 10, 20, 50, 100]"
          (page)="pageChanged($event)">
        </mat-paginator>
      </div>
    </ng-container>
  
    <ng-template #noAppointments>
      <div class="bg-white p-4 rounded-lg border border-green-100 shadow-sm text-center">
        <p class="text-gray-500">You don't have any past appointments yet.</p>
      </div>
    </ng-template>
  </div>
