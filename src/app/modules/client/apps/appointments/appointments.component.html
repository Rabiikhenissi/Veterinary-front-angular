<div class="calendar-wrapper">
  <div class="full-calendar-container" [ngStyle]="{'min-height': '1000px'}">
    <full-calendar [options]="CalendarOptions">
      <ng-template #eventContent let-arg>
        <b>{{ arg.timeText }}</b>
        <i>{{ arg.event.title }}</i>
      </ng-template>
    </full-calendar>
  </div>
</div>
