<div class="max-w-7xl w-full mx-auto p-6 bg-green-50 rounded-2xl shadow-xl border border-green-100">
  <h2 class="text-2xl font-bold text-green-800 mb-6 flex items-center gap-2">
    📅 My Past Appointments
  </h2>

  <ng-container *ngIf="appointments?.length > 0; else noAppointments">
    <ul class="space-y-4">
      <li
        *ngFor="let appt of appointments"
        class="group p-5 bg-white border border-green-100 rounded-xl shadow-sm hover:shadow-md hover:border-green-300 transition-all cursor-pointer"
        (click)="navigateToDetails(appt._id)"
        tabindex="0"
        role="button"
        aria-label="View appointment details"
      >
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <!-- Pet Info -->
          <div class="flex items-center">
            <img
              [src]="appt.petId.icon"
              alt="{{ appt.petId.name }}"
              class="w-14 h-14 rounded-full border-2 border-green-300 bg-white mr-4"
            />
            <div>
              <p class="font-semibold text-lg text-green-800">
                {{ appt.petId.name }} <span class="text-sm text-green-700">({{ appt.petId.species }})</span>
              </p>
              <p class="text-sm text-gray-600">
                📅 {{ appt.date | date:'dd/MM/yyyy' }} &nbsp; 🕒 {{ ('1970-01-01T' + appt.time) |  date:'HH:mm'}}
              </p>
            </div>
          </div>

          <!-- Company Info -->
          <div class="text-sm text-gray-500 sm:text-right">
            <span class="font-medium text-green-700">🏢 Company:</span>
            {{ appt.companyId?.name || 'N/A' }}
          </div>
        </div>
      </li>
    </ul>

    <!-- Pagination -->
    <div class="mt-8 flex justify-center">
      <mat-paginator
        [length]="total"
        [pageSize]="currentSize"
        [pageIndex]="currentPage - 1"
        [pageSizeOptions]="[5, 10, 20, 50, 100]"
        (page)="pageChanged($event)"
      ></mat-paginator>
    </div>
  </ng-container>

  <ng-template #noAppointments>
    <div class="bg-white p-6 rounded-xl border border-green-100 shadow text-center">
      <p class="text-gray-500 text-base">You don't have any past appointments yet.</p>
    </div>
  </ng-template>
</div>
