<div class="max-w-7xl w-full mx-auto p-6 relative bg-green-50 rounded-xl shadow-lg border border-green-100">
  <h2 class="text-3xl font-extrabold text-green-900 mb-8 flex items-center gap-3 tracking-tight">
    <span class="inline-flex items-center justify-center w-10 h-10 bg-green-100 rounded-full text-2xl">📅</span>
    My Past Appointments
  </h2>

  <ng-container *ngIf="appointments?.length > 0; else noAppointments">
    <ul class="space-y-6">
      <li *ngFor="let appt of appointments"
          class="p-6 bg-white border border-green-200 rounded-xl shadow hover:shadow-lg transition-all cursor-pointer flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6 group"
          (click)="navigateToDetails(appt._id)">
        <!-- Pet Info -->
        <div class="flex items-center gap-5">
          <img [src]="appt.petId.icon"
               alt="{{ appt.petId.name }}"
               class="w-16 h-16 rounded-full border-4 border-green-200 bg-white shadow-sm group-hover:scale-105 transition-transform">
          <div>
            <p class="font-bold text-xl text-green-900">{{ appt.petId.name }} <span class="text-green-600 font-medium">({{ appt.petId.species }})</span></p>
            <p class="text-sm text-green-700 mt-1 flex items-center gap-2">
              <span class="inline-block">📅 {{ appt.date | date:'dd/MM/yyyy' }}</span>
              <span class="inline-block">|</span>
              <span class="inline-block">🕒 {{ ('1970-01-01T' + appt.time) | date:'HH:mm'}}</span>
            </p>
          </div>
        </div>
        <div class="text-sm text-gray-600 mt-2 sm:mt-0 flex items-center gap-2">
          <span class="font-medium text-green-700">Company:</span>
          <span>{{ appt.companyId?.name || 'N/A' }}</span>
        </div>
      </li>
    </ul>

    <!-- Pagination -->
    <div class="mt-8 flex justify-center">
      <mat-paginator
        [length]="total"
        [pageSize]="currentSize"
        [pageIndex]="currentPage - 1"
        [pageSizeOptions]="[5, 10, 20, 50, 100]"
        (page)="pageChanged($event)">
      </mat-paginator>

    </div>
  </ng-container>

  <ng-template #noAppointments>
    <div class="bg-white p-8 rounded-xl border border-green-200 shadow text-center">
      <p class="text-gray-400 text-lg">You don't have any past appointments yet.</p>
    </div>
  </ng-template>
</div>
