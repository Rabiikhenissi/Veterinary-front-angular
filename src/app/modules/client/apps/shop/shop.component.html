<app-cart-sidebar></app-cart-sidebar>

<!-- Floating Cart Button -->
<button 
  (click)="sidebar.toggleCart()" 
  class="fixed top-6 right-6 z-50 bg-green-200 hover:bg-green-300 text-slate-800 px-6 py-3 rounded-full shadow-2xl flex items-center gap-2 transition-all duration-300 border-2 border-white/30 backdrop-blur-lg"
>
  <span class="text-2xl animate-bounce">🛒</span>
  <span 
    *ngIf="cart?.products?.length" 
    class="absolute -top-2 -right-2 bg-green-300 text-slate-900 text-xs font-bold w-7 h-7 flex items-center justify-center rounded-full border-2 border-white shadow"
  >
    {{ getTotalItems() }}
  </span>
</button>

<div
  class="max-w-7xl w-full mx-auto p-6 relative bg-green-50 rounded-xl shadow-lg border border-green-100"
>
  <div class="flex flex-col lg:flex-row gap-10">

    <!-- Sidebar Filters -->
    <aside class="w-full lg:w-1/4 bg-gradient-to-br from-white via-slate-50 to-sky-50 border border-sky-200/40 rounded-3xl p-8 space-y-10 shadow-xl relative overflow-hidden">
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-gradient-to-br from-sky-100 via-emerald-100 to-transparent rounded-full blur-2xl opacity-40 pointer-events-none"></div>
      <!-- Search -->
      <div>
        <div class="flex items-center bg-white/80 rounded-xl shadow-inner px-4 py-2 border border-sky-200 focus-within:ring-2 focus-within:ring-sky-400 transition">
          <span class="text-sky-500 text-xl mr-2">🔍</span>
          <input [(ngModel)]="searchQuery"
                 (ngModelChange)="onSearchChange()"
                 placeholder="Search products..."
                 class="w-full bg-transparent outline-none text-slate-800 placeholder-sky-400" />
        </div>
      </div>
      <!-- Species Filter -->
      <div>
        <h3 class="text-lg font-extrabold text-sky-700 mb-4 tracking-wide uppercase">Pet Types</h3>
        <div class="flex flex-wrap gap-3">
          <button *ngFor="let species of speciesList"
            (click)="toggleSpecies(species.name)"
            [ngClass]="selectedSpecies.includes(species.name) ? 'bg-sky-200 text-slate-900 shadow-lg scale-105' : 'bg-white/80 text-sky-700 border border-sky-200'"
            class="px-4 py-2 rounded-xl font-semibold transition-all duration-200 hover:scale-105 hover:bg-sky-100 focus:outline-none focus:ring-2 focus:ring-sky-400">
            {{ species.name }}
          </button>
        </div>
      </div>
      <!-- Categories Filter -->
      <div>
        <h3 class="text-lg font-extrabold text-sky-700 mb-4 tracking-wide uppercase">Categories</h3>
        <div class="flex flex-wrap gap-3">
          <button *ngFor="let category of categories"
            (click)="onCategoryToggle(category)"
            [ngClass]="selectedCategories.includes(category) ? 'bg-emerald-200 text-slate-900 shadow-lg scale-105' : 'bg-white/80 text-emerald-700 border border-emerald-200'"
            class="px-4 py-2 rounded-xl font-semibold transition-all duration-200 hover:scale-105 hover:bg-emerald-100 focus:outline-none focus:ring-2 focus:ring-emerald-400">
            {{ category }}
          </button>
        </div>
      </div>
    </aside>

    <!-- Product Grid -->
    <main class="w-full lg:w-3/4">
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-10">
        <div *ngFor="let product of products" (click)="viewProduct(product._id)"
          class="bg-gradient-to-br from-white via-slate-50 to-sky-50 border border-sky-200/40 rounded-3xl shadow-xl hover:shadow-2xl transition p-7 flex flex-col justify-between cursor-pointer group relative overflow-hidden hover:scale-[1.03] duration-300">
          <div class="relative">
            <img [src]="getProductImageUrl(product.image)" alt="{{ product.name }}" class="w-full h-52 object-cover rounded-2xl mb-4 border border-sky-100 group-hover:scale-105 transition-transform duration-300 shadow-lg" />
            <div *ngIf="product.quantity === 0" class="absolute top-3 left-3 bg-gradient-to-r from-red-300 to-pink-200 text-white text-xs px-3 py-1 rounded-full font-bold shadow">Out of stock</div>
          </div>
          <div class="flex-1">
  <h3 class="text-2xl font-extrabold text-green-800 mb-1 truncate tracking-wide">{{ product.name }}</h3>
  <p class="text-sm text-green-700 mb-3 line-clamp-2">{{ product.description || 'No description' }}</p>
  <div class="flex flex-wrap gap-2 mb-3">
    <span class="bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full font-semibold shadow">{{ product.category }}</span>
    <span class="bg-emerald-50 text-emerald-700 text-xs px-3 py-1 rounded-full font-semibold shadow">{{ product.species || 'All' }}</span>
  </div>
  <p class="text-green-700 font-extrabold text-xl mt-2 tracking-wider">{{ product.price | currency:'TND ':'symbol':'1.2-3' }}</p>
</div>
<button
  [disabled]="product?.quantity === 0"
  (click)="addToCart(product); $event.stopPropagation()"
  class="mt-5 bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-xl text-base shadow-lg transition-all duration-300 disabled:opacity-50 w-full font-bold tracking-wide">
  Add to Cart
</button>
        </div>
      </div>
            

      <!-- Pagination -->
      <div class="mt-10 flex justify-center">
        <mat-paginator
          [length]="total"
          [pageSize]="currentSize"
          [pageIndex]="currentPage - 1"
          [pageSizeOptions]="[5, 10, 20, 50, 100]"
          (page)="pageChanged($event)">
        </mat-paginator>
      </div>
    </main>
  </div>
</div>
