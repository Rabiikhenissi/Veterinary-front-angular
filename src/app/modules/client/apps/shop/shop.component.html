<app-cart-sidebar></app-cart-sidebar>

<button 
  (click)="sidebar.toggleCart()" 
  class="fixed top-4 right-4 z-50 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-full shadow-lg "
>
  🛒
  <span 
    *ngIf="cart?.products?.length" 
    class="absolute -top-1 -right-1 bg-green-300 text-black text-sm font-bold w-5 h-5 flex items-center justify-center rounded-full"
  >
    {{ getTotalItems() }}
  </span>
</button>

<div class="max-w-7xl w-full mx-auto p-6 bg-green-50 rounded-xl shadow-lg border border-green-100">

  <!-- Layout: Sidebar + Product Grid -->
  <div class="flex flex-col lg:flex-row gap-6">

    <!-- Left Sidebar Filters -->
    <div class="w-full lg:w-1/4 bg-white border border-green-100 rounded-lg p-4 space-y-6 shadow-sm">
      <!-- Search Field -->
      <div>
        <input [(ngModel)]="searchQuery"
               (ngModelChange)="onSearchChange()"
               placeholder="🔍 Search products..."
               class="w-full px-4 py-2 rounded-md border border-green-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-green-300" />
      </div>
      <!-- Species Filter -->
      <div>
        <h3 class="text-lg font-semibold text-green-800 mb-2">Pets:</h3>
        <div class="space-y-2">
          <label *ngFor="let species of speciesList" class="flex items-center gap-2 text-sm text-gray-700">
            <input type="checkbox"
                  [value]="species.name"
                  [checked]="selectedSpecies.includes(species.name)"
                  (change)="toggleSpecies(species.name)"
                  class="form-checkbox text-green-600 rounded" />
            {{ species.name }}
          </label>
        </div>
      </div>

      <!-- Categories Filter -->
      <div>
        <h3 class="text-lg font-semibold text-green-800 mb-2">Categories:</h3>
        <div class="space-y-2">
          <label *ngFor="let category of categories" class="flex items-center gap-2 text-sm text-gray-700">
            <input type="checkbox"
                  [value]="category"
                  (change)="onCategoryToggle(category)"
                  [checked]="selectedCategories.includes(category)"
                  class="form-checkbox text-green-600 rounded" />
            {{ category }}
          </label>
        </div>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="w-full lg:w-3/4">
      <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
        <div *ngFor="let product of products" (click)="viewProduct(product._id)"
        class="bg-white border border-green-100 rounded-lg shadow-sm hover:shadow-md transition p-4 flex flex-col justify-between cursor-pointer">
          <img [src]="getProductImageUrl(product.image)" alt="{{ product.name }}" class="w-full h-40 object-cover rounded-md mb-4 border border-green-200" />
          <div class="flex-1">
            <h3 class="text-lg font-bold text-green-800">{{ product.name }}</h3>
            <p class="text-sm text-green-700">{{ product.description || 'No description' }}</p>
            <p class="text-sm text-gray-500 mt-2">Category: {{ product.category }}</p>
            <p class="text-sm text-gray-500">Species: {{ product.species || 'All' }}</p>
            <p class="text-green-700 font-semibold mt-2">{{ product.price | currency:'TND ':'symbol':'1.2-3' }}</p>
            <p class="text-sm text-red-500 font-semibold" *ngIf="product.quantity === 0">Out of stock</p>
          </div>
          
          <!-- Add to Cart Button -->
          <button
            [disabled]="product?.quantity === 0"
            (click)="addToCart(product); $event.stopPropagation()"
            class="mt-4 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md text-sm shadow transition-colors duration-500 ease-in-out disabled:opacity-50">
            Add to Cart
          </button>
        </div>
      </div>

      <!-- Pagination -->
      <div class="mt-6 flex justify-center">
        <mat-paginator
          [length]="total"
          [pageSize]="currentSize"
          [pageIndex]="currentPage - 1"
          [pageSizeOptions]="[5, 10, 20, 50, 100]"
          (page)="pageChanged($event)">
        </mat-paginator>
      </div>
    </div>
  </div>
</div>
