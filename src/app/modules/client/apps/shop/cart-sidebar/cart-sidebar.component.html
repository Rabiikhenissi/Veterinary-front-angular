<!-- Futuristic Cart Sidebar -->
<div *ngIf="isOpen" class="fixed inset-0 z-60 flex justify-end font-sans">
  <!-- Glassmorphic Backdrop -->
  <div 
    class="absolute inset-0 bg-gradient-to-br from-green-200/40 via-white/30 to-green-400/30 backdrop-blur-sm transition-opacity duration-300"
    (click)="closeCart()"
  ></div>

  <!-- Glassmorphic Sidebar -->
  <div 
    class="relative h-full w-96 max-w-full bg-white/70 backdrop-blur-xl shadow-2xl border-l border-green-300/40 transition-transform duration-300 flex flex-col rounded-l-3xl"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="flex justify-between items-center p-6 border-b border-green-200/40 bg-white/40 rounded-tl-3xl">
      <button 
        class="text-xs text-gray-700 hover:underline hover:text-red-500 transition"
        (click)="clearCart()"
      >
        <span class="inline-flex items-center gap-1">Clear All <span class="text-lg">🗑️</span></span>
      </button>
      <h2 class="text-2xl font-bold text-green-700 tracking-wide drop-shadow">Your Cart</h2>
      <button (click)="closeCart()" class="text-2xl text-red-400 hover:text-red-600 transition">✖</button>
    </div>

    <!-- Cart Items -->
    <div class="p-6 space-y-5 overflow-y-auto flex-1 custom-scrollbar">
      <ng-container *ngIf="!cart?.products?.length; else cartItems">
        <div class="text-gray-400 text-center text-lg mt-10 tracking-wide">🛒 Cart is empty</div>
      </ng-container>

      <ng-template #cartItems>
        <div *ngFor="let item of cart.products; trackBy: trackByIndex" class="bg-white/60 border border-green-100 rounded-xl shadow-md p-4 flex flex-col gap-2 hover:shadow-lg transition">
          <div class="flex justify-between items-center">
            <p class="font-semibold text-green-900 text-lg">{{ item.productId.name }}</p>
            <p class="text-base text-green-700 font-mono">{{ item.productId.price | currency:'TND ':'symbol':'1.2-3' }}</p>
          </div>
          <div class="flex justify-between items-center mt-1">
            <div class="flex items-center gap-2">
              <button class="w-8 h-8 bg-green-100 text-green-700 rounded-full hover:bg-green-200 transition" (click)="decreaseQuantity(item)">-</button>
              <span class="text-lg font-semibold">{{ item.quantity }}</span>
              <button class="w-8 h-8 bg-green-100 text-green-700 rounded-full hover:bg-green-200 transition" (click)="increaseQuantity(item)">+</button>
            </div>
            <div class="flex items-center gap-2">
              <p class="font-semibold text-gray-700 text-right">
                {{ item.productId.price * item.quantity | currency:'TND ':'symbol':'1.2-3' }}
              </p>
              <button class="text-red-400 hover:text-red-600 text-xl transition" (click)="removeItem(item)">
                🗑️
              </button>
            </div>
          </div>
        </div>
      </ng-template>
    </div>

    <!-- Total & Confirm -->
    <div class="p-6 border-t border-green-200/40 bg-white/40 rounded-bl-3xl space-y-4">
      <div class="flex justify-between items-center">
        <p class="text-base text-gray-600">Total:</p>
        <p class="text-2xl font-extrabold text-green-700 font-mono tracking-wider">
          {{ totalPrice | currency:'TND ':'symbol':'1.2-3' }}
        </p>
      </div>
      <button 
        class="w-full py-3 text-white font-bold bg-gradient-to-r from-green-500 via-green-600 to-green-700 rounded-xl shadow-lg hover:scale-105 hover:from-green-600 hover:to-green-800 transition-all duration-300 flex items-center justify-center gap-3 text-lg"
        (click)="confirmPurchase()"
      >
        <span>Confirm Purchase</span>
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7-7 7M5 12h13"></path>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- Optional: Custom scrollbar styling (add to your global styles if desired) -->
<style>
.custom-scrollbar::-webkit-scrollbar {
  width: 8px;
}
.custom-scrollbar::-webkit-scrollbar-thumb {
  background: #a7f3d0;
  border-radius: 8px;
}
.custom-scrollbar::-webkit-scrollbar-track {
  background: transparent;
}
</style>
