<div class="max-w-full w-1/2 mx-auto mt-8 mb-16 p-6 bg-green-50 rounded-xl shadow-lg border border-green-100">
  <h2 class="text-2xl font-bold text-green-800 mb-6 text-center">Edit Pet</h2>

  <form [formGroup]="petForm" (ngSubmit)="onSubmit()">
    <!-- Name Field -->
    <div class="mb-6">
      <label class="block font-semibold text-green-700">Name</label>
      <input type="text" formControlName="name" 
             class="w-full px-4 py-3 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500" />
    </div>

    <!-- Birth Date Field -->
    <div class="mb-6">
      <label class="block font-semibold text-green-700">Birth Date</label>
      <input type="date" formControlName="birthDate" 
             class="w-full px-4 py-3 border rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500" />
    </div>

    <!-- Species Selector -->
    <div class="mb-6">
      <label class="block font-semibold text-green-700 mb-2">Select a Species</label>
      <div
        class="grid gap-4"
        style="grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)) "
      >
        @for (item of icons; track $index) {
          <div
            class="flex flex-col items-center cursor-pointer p-4 rounded-lg border-2 transition-all 
                   hover:border-blue-500 hover:shadow-lg"
            [class.border-blue-500]="petForm.value.icon === item.icon"
            (click)="selectIcon(item)"
          >
            <img [src]="item.icon" [alt]="item.label" class="w-16 h-16 mb-2" />
            <span class="text-sm font-medium text-green-700">{{ item.label }}</span>
          </div>
        }
      </div>
    </div>
    

    <!-- Submit Button -->
    <button type="submit" 
            class="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600 transition-colors duration-300 disabled:opacity-50" 
            [disabled]="petForm.invalid">
            💾 Save Changes
    </button>
  </form>
</div>
