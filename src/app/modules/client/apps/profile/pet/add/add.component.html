<div class="max-w-md mx-auto mt-6 p-6 bg-white rounded-lg shadow-md">
    <h2 class="text-xl font-bold mb-4">Add a New Pet</h2>
  
    <form [formGroup]="petForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block font-semibold">Name</label>
        <input type="text" formControlName="name"
               class="w-full px-3 py-2 border rounded" />
      </div>
  
   
  
      <div class="mb-4">
        <label class="block font-semibold">Birth Date</label>
        <input type="date" formControlName="birthDate"
               class="w-full px-3 py-2 border rounded" />
      </div>
  
      <div class="mb-4">
        <label class="block font-semibold mb-2">Select a Species</label>
        <div class="grid grid-cols-3 gap-4">
          <div
            *ngFor="let item of icons"
            class="flex flex-col items-center cursor-pointer p-2 rounded-lg border-2 transition-all"
            [class.border-blue-500]="petForm.value.icon === item.icon"
            (click)="selectIcon(item)"
          >
            <img [src]="item.icon" [alt]="item.label" class="w-16 h-16 mb-1" />
            <span class="text-sm font-medium">{{ item.label }}</span>
          </div>
        </div>
      </div>
  
      <button type="submit"
              class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
              [disabled]="petForm.invalid">
        Add Pet
      </button>
    </form>
  </div>
