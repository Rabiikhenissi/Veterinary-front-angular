<div class="max-w-md mx-auto mt-10 p-6 bg-white shadow-lg rounded-xl text-center">
    <!-- Icône de profil -->
    <div class="flex justify-center">
        <img [src]="user.icon || selectedIcon" alt="Profile Icon"
            class="w-20 h-20 rounded-full border-4 border-gray-300 bg-gray-100 p-2">
    </div>

    <!-- Sélection d'icône -->
    <div class="mt-4">
        <label class="block text-gray-700 font-medium">choose an icon</label>
        <div class="flex justify-center space-x-4 mt-2">
            @for (icon of icons; track $index) {
            <img  [src]="icon" alt="Icon" (click)="selectIcon(icon)"
                class="w-12 h-12 cursor-pointer rounded-full border-2 border-gray-200 hover:border-blue-500 transition">
            }</div>
    </div>

    

    <!-- Nom et Email -->
    <h2 class="mt-4 text-2xl font-semibold text-gray-800">{{ user.name }}</h2>
    <p class="text-gray-600">{{ user.email }}</p>

    <!-- Bouton de sauvegarde -->
    <button (click)="saveProfile()"
        class="mt-4 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition duration-200">
        save
    </button>

    <!-- Bouton de déconnexion -->
    <button (click)="logout()"
        class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition duration-200">
        sign out
    </button>
</div>
