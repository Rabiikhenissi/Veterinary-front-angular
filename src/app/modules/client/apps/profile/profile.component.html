<div class="max-w-7xl w-full mx-auto p-6 relative bg-green-50 rounded-xl shadow-lg border border-green-100">
  <!-- Edit Profile Button -->
  <button (click)="editProfile()"
    class="absolute top-4 right-4 bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded-md text-sm shadow transition-colors duration-500 ease-in-out">
    ✏️ Edit Profile
  </button>

  <!-- Profile Avatar -->
  <div class="flex justify-center mb-4">
    <img [src]="selectedAvatar" 
         alt="User Avatar" 
         class="w-24 h-24 rounded-full shadow-lg border-4 border-green-300 object-cover" />
  </div>

  <!-- User Info -->
  <div class="text-center mb-6">
    <h2 class="text-2xl font-bold text-green-800">{{ user.name }}</h2>
    <p class="text-gray-600">{{ user.email }}</p>
  </div>

  <!-- Pets Section -->
  <div class="mt-8 bg-white p-4 rounded-lg shadow-md border border-green-100">
    <!-- My Pets title + Add Button -->
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-4 gap-2">
      <h3 class="text-xl font-bold text-green-700 flex items-center gap-2">
        🐶 My Pets
      </h3>
      <button (click)="addNewPet()"
        class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded-md text-sm shadow transition-colors duration-500 ease-in-out w-full sm:w-auto">
        ➕ Add New
      </button>
    </div>

    <ul class="space-y-4">
      @for (pet of user.pets; track $index) {
      <li class="p-4 bg-green-50 border border-green-100 rounded-lg shadow-sm hover:shadow-md transition">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <!-- Pet Info -->
          <div class="flex items-center">
            <img [src]="pet.icon" alt="{{ pet.name }}" class="w-12 h-12 rounded-full mr-4 border-2 border-green-300 bg-white">
            <div>
              <p class="font-semibold text-lg text-green-800">{{ pet.name }}</p>
              <p class="text-sm text-green-700">
                {{ pet.species }} · Born: {{ pet.birthDate | date : "shortDate" }}
              </p>
            </div>
          </div>

          <!-- Buttons -->
          <div class="flex flex-col sm:flex-row gap-2 sm:justify-end w-full sm:w-auto">
            <button 
              class="bg-teal-500 hover:bg-teal-600 text-white px-4 py-2 rounded-md text-sm shadow 
                     transition-colors duration-500 ease-in-out w-full sm:w-auto" (click)="viewPetDetails(pet._id)">
              View
            </button>
            <button 
              class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-md text-sm shadow 
                     transition-colors duration-500 ease-in-out w-full sm:w-auto"(click)="editPet(pet._id)">
              Edit
            </button>
          </div>
        </div>
      </li>}
    </ul>
  </div>
</div>
