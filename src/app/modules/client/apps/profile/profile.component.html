<div class="max-w-xl mx-auto p-6 relative">
  <!-- Edit Profile Button -->
  <button (click)="editProfile()"
    class="absolute top-4 right-4 bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded-md text-sm">
    Edit Profile
  </button>

  <!-- Profile Avatar -->
  <div class="flex justify-center mb-4">
    <img [src]="selectedAvatar" 
         alt="User Avatar" 
         class="w-24 h-24 rounded-full shadow-lg border-2 border-gray-300 object-cover" />
  </div>

  <!-- User Info -->
  <div class="text-center mb-6">
    <h2 class="text-2xl font-semibold">{{ user.name }}</h2>
    <p class="text-gray-600">{{ user.email }}</p>
  </div>

  <!-- Logout Button -->
  <button (click)="logout()"
    class="mt-4 bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition duration-200">
    Sign out
  </button>

  <!-- Pets Section -->
  <div class="mt-6 w-80">
    <!-- My Pets title + Add Button -->
    <div class="flex justify-between items-center mb-2">
      <h3 class="text-xl font-bold">My Pets:</h3>
      <button (click)="addNewPet()"
        class="bg-green-500 hover:bg-green-600 text-white px-3 py-1 rounded-md text-sm">
        Add New
      </button>
    </div>

    <ul class="space-y-4">
      @for (pet of user.pets; track $index) {
      <li class="flex items-center justify-between p-4 bg-white shadow rounded-lg">
        <!-- Pet Info -->
        <div class="flex items-center">
          <img [src]="pet.icon" alt="{{ pet.name }}" class="w-12 h-12 rounded-full mr-4">
          <div>
            <p class="font-medium text-lg">{{ pet.name }}</p>
            <p class="text-sm text-gray-500">
              {{ pet.species }} - Born: {{ pet.birthDate | date : "shortDate" }}
            </p>
          </div>
        </div>

        <!-- Buttons -->
        <div class="flex space-x-2">
          <button 
            class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-md text-sm"
            (click)="viewPetDetails(pet._id)">
            View
          </button>
          <button 
            class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded-md text-sm"
            (click)="editPet(pet._id)">
            Edit
          </button>
        </div>
      </li>}
    </ul>
  </div>
</div>
