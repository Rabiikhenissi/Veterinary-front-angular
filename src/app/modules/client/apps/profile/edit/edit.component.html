<div class="max-w-lg mx-auto p-6 bg-white shadow rounded-lg">
    <h2 class="text-2xl font-bold mb-4">Edit Profile</h2>
  
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block font-semibold">Name</label>
        <input type="text" formControlName="name" class="w-full px-3 py-2 border rounded" />
      </div>
  
      <div class="mb-4">
        <label class="block font-semibold">Email</label>
        <input type="email" formControlName="email" class="w-full px-3 py-2 border rounded" />
      </div>
  
      <div class="mb-4">
        <label class="block font-semibold">Avatar URL</label>
        <input type="text" formControlName="avatar" class="w-full px-3 py-2 border rounded" />
      </div>
  
      <button type="submit"
              class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600"
              [disabled]="profileForm.invalid">
        Save Changes
      </button>
    </form>
  </div>
