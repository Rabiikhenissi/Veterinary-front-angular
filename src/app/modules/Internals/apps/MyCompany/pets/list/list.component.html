<div class="w-full max-w-7xl mx-auto px-10 py-10 bg-gradient-to-br from-green-100 via-green-50 to-white border border-green-200 rounded-3xl shadow-2xl backdrop-blur-md">
  <div class="flex items-center justify-between mb-10">
    <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-700 via-emerald-500 to-lime-400 animate-gradient-x">
      🐾 Pet Species
    </h2>
    <button
      (click)="add()"
      class="bg-gradient-to-r from-green-500 to-emerald-400 hover:from-emerald-500 hover:to-green-400 text-white py-2 px-8 rounded-2xl text-lg font-semibold shadow-lg transition-all duration-300 transform hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-green-200"
    >
      <span class="animate-pulse">➕ Add Species</span>
    </button>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
    <div
      *ngFor="let species of speciesList"
      class="relative group border-2 rounded-2xl p-8 flex flex-col items-center text-center bg-white/70 shadow-xl transition-all duration-300 overflow-hidden cursor-pointer hover:shadow-2xl hover:-translate-y-2"
      [ngClass]="{
        'border-green-500 bg-gradient-to-br from-green-100 via-white to-green-50 shadow-2xl scale-105': selectedSpeciesId === species._id,
        'border-gray-200 hover:border-green-400': selectedSpeciesId !== species._id
      }"
    >
      <!-- Animated Glow -->
      <div class="absolute inset-0 pointer-events-none z-0">
        <div
          *ngIf="selectedSpeciesId === species._id"
          class="w-full h-full rounded-2xl bg-gradient-to-br from-green-200 via-green-100 to-white opacity-60 blur-2xl animate-glow"
        ></div>
      </div>
      <img
        [src]="species.icon"
        alt="{{ species.name }}"
        class="w-24 h-24 object-cover rounded-full mb-4 border-4 border-green-200 shadow-lg transition-transform duration-300 group-hover:scale-110"
      />
      <span class="font-bold text-lg text-green-800 tracking-wide drop-shadow-md z-10">{{ species.name }}</span>
      <span class="text-sm text-gray-500 z-10">Species</span>

      <!-- Edit/Delete buttons -->
      <div class="absolute top-3 right-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-20">
        <button
          (click)="editSpecies(species)"
          class="bg-white/80 rounded-full p-2 shadow hover:bg-blue-100 text-blue-600 hover:text-blue-800 transition-colors duration-200"
          title="Edit"
        >
          <span class="animate-spin-slow">✏️</span>
        </button>
        <button
          (click)="archiveSpecies(species)"
          class="bg-white/80 rounded-full p-2 shadow hover:bg-red-100 text-red-600 hover:text-red-800 transition-colors duration-200"
          title="Delete"
        >
          🗑️
        </button>
      </div>
    </div>
  </div>
  <div class="mt-10 flex justify-center">
    <mat-paginator
      [length]="total"
      [pageSize]="currentSize"
      [pageIndex]="currentPage - 1"
      [pageSizeOptions]="[5, 10, 20, 50, 10]"
      (page)="pageChanged($event)">
    </mat-paginator>
  </div>
</div>

<!-- Add this to your global styles or component styles for custom animations -->
<style>
@keyframes gradient-x {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}
.animate-gradient-x {
  background-size: 200% 200%;
  animation: gradient-x 4s ease-in-out infinite;
}
@keyframes glow {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}
.animate-glow {
  animation: glow 2s ease-in-out infinite;
}
@keyframes spin-slow {
  0% { transform: rotate(0deg);}
  100% { transform: rotate(360deg);}
}
.animate-spin-slow {
  animation: spin-slow 2s linear infinite;
}
</style>
