<div class="w-full max-w-3xl mx-auto px-10 py-10 bg-green-50 border border-green-100 rounded-3xl shadow-2xl">
    <h2 class="text-4xl font-bold text-green-800 mb-10 text-center">🐾 Add Pet Species</h2>
  
    <form [formGroup]="speciesForm" (ngSubmit)="submit()" class="space-y-8">
      <div>
        <label class="block text-xl font-semibold text-green-700 mb-2">Species Name</label>
        <input
          type="text"
          formControlName="name"
          placeholder="e.g. Dog, Cat, Rabbit"
          class="w-full border-2 border-green-200 p-4 rounded-xl text-green-900 text-lg shadow-md"
        />
        <div *ngIf="speciesForm.get('name')?.invalid && speciesForm.get('name')?.touched" class="text-red-500 mt-1">
          Name is required.
        </div>
      </div>
  
      <div>
        <label class="block text-xl font-semibold text-green-700 mb-2">Species Icon URL</label>
        <input
          type="text"
          formControlName="icon"
          placeholder="https://example.com/dog-icon.png"
          class="w-full border-2 border-green-200 p-4 rounded-xl text-green-900 text-lg shadow-md"
        />
        <div *ngIf="speciesForm.get('icon')?.invalid && speciesForm.get('icon')?.touched" class="text-red-500 mt-1">
         Icon is required.
        </div>
      </div>
  
      <div class="flex justify-center">
        <button
          type="submit"
          [disabled]="speciesForm.invalid "
          class="bg-green-600 hover:bg-green-700 text-white py-4 px-10 rounded-2xl text-xl font-bold shadow-lg transition-all duration-300"
        >
          Add Species
        </button>
      </div>
    </form>
  </div>
