<div
  class="w-full max-w-7xl mx-auto px-10 py-14 bg-gradient-to-br from-green-50 via-white to-green-100 border border-green-200 rounded-3xl shadow-2xl backdrop-blur-lg"
>
  <h2
    class="text-4xl font-extrabold text-green-800 mb-8 tracking-tight flex items-center gap-2"
  >
    <span class="inline-block animate-pulse">✏️</span> Edit Service
  </h2>

  <form (ngSubmit)="submit()" #serviceForm="ngForm" class="space-y-8">
    <!-- Service Name -->
    <div>
      <label
        class="block text-lg text-green-800 font-semibold mb-2 tracking-wide"
        >Service</label
      >
      <select
        class="w-full border-2 border-green-300 rounded-2xl px-5 py-3 text-gray-900 bg-white focus:ring-4 focus:ring-green-100 transition-all duration-200 shadow-sm"
        [(ngModel)]="selectedService"
        name="name"
        required
      >
        <option value="" disabled>Select a service</option>
        <option *ngFor="let service of predefinedServices" [value]="service.name">
          {{ service.name }}
        </option>
      </select>
    </div>

    <!-- Price -->
    <div>
      <label
        class="block text-lg text-green-800 font-semibold mb-2 tracking-wide"
        >Price</label
      >
      <div class="relative">
        <span
          class="absolute left-4 top-1/2 -translate-y-1/2 text-green-400 text-xl"
          >💲</span
        >
        <input
          type="number"
          class="w-full border-2 border-green-300 rounded-2xl pl-12 pr-5 py-3 text-gray-900 bg-white focus:ring-4 focus:ring-green-100 transition-all duration-200 shadow-sm"
          [(ngModel)]="price"
          name="price"
          required
          min="0"
          step="0.01"
        />
      </div>
    </div>

    <!-- Submit -->
    <div class="flex justify-end">
      <button
        type="submit"
        [disabled]="!serviceForm.form.valid"
        class="bg-green-700 hover:bg-green-900 text-white py-3 px-8 rounded-2xl text-xl font-bold shadow-lg transition-all duration-300 flex items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
      >
        <span class="inline-block animate-bounce">💾</span> Update Service
      </button>
    </div>
  </form>
</div>
