<div
  class="max-w-7xl w-full mx-auto p-8 relative bg-gradient-to-br from-green-50 via-white to-green-100 rounded-2xl shadow-2xl border border-green-200 overflow-hidden"
>
  
    <h2 class="text-3xl font-extrabold text-green-800 mb-8 flex items-center gap-3">
       Add New Product
    </h2>
    <form #form="ngForm" (ngSubmit)="addProduct()" class="space-y-7" novalidate>
      <!-- Name -->
      <div>
        <label class="block font-semibold text-green-700 mb-2">Product Name <span class="text-red-500">*</span></label>
       <input [(ngModel)]="product.name" name="name" #name="ngModel" required minlength="2"
       class="w-full px-4 py-3 rounded-xl shadow-sm border border-green-200 focus:outline-none focus:ring-2 focus:ring-green-400 bg-white text-lg"
       [class.border-red-500]="(name.invalid && name.touched) || (name.value?.length < 2 && name.touched)" />
<div *ngIf="(name.invalid && name.touched) || (name.value?.length < 2 && name.touched)" class="text-red-600 text-sm mt-1">
  Product name must be at least 2 characters.
</div>
        <div *ngIf="name.invalid && name.touched" class="text-red-600 text-sm mt-1">Product name is required.</div>
      </div>

      <!-- Category -->
      <mat-form-field appearance="fill" class="w-full rounded-xl">
        <mat-label class="text-green-800 font-semibold">Category <span class="text-red-500">*</span></mat-label>
        <mat-select
          [(ngModel)]="product.category"
          name="category"
          #category="ngModel"
          
          required
          [disableRipple]="true"
        >
          <mat-option value="" disabled>Select Category</mat-option>
          <mat-option *ngFor="let cat of categories" [value]="cat">
            {{ cat }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="category.invalid && category.touched">
          Category is required.
        </mat-error>
      </mat-form-field>

      <!-- Species -->
<div *ngIf="product.category !== 'Medical Supplies'">
  <label class="block font-semibold text-green-700 mb-2">Species</label>
  <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
    <div *ngFor="let sp of speciesOptions"
         class="flex flex-col items-center cursor-pointer p-3 rounded-2xl border-2 transition-all duration-300 ease-in-out shadow-sm hover:shadow-md bg-white"
         [class.border-green-500]="product.species?.includes(sp.name)"
         (click)="selectSpecies(sp.name)">
      <img [src]="sp.icon" [alt]="sp.name" class="w-14 h-14 mb-1 object-cover rounded" />
      <span class="text-base font-medium text-green-700">{{ sp.name }}</span>
    </div>
  </div>
  <!-- Validation message for species -->
  <div *ngIf="speciesTouched && (!product.species || product.species.length === 0)" class="text-red-600 text-sm mt-1">
    Please select at least one species.
  </div>
</div>

      

      <!-- Price & Quantity -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
        <div>
          <label class="block font-semibold text-green-700 mb-2">Price <span class="text-red-500">*</span></label>
          <div class="flex items-center space-x-2">
            <input [(ngModel)]="product.price" name="price" #price="ngModel" type="number" step="0.1" required
                   class="w-full px-4 py-3 rounded-xl shadow-sm border border-green-200 focus:outline-none focus:ring-2 focus:ring-green-400 bg-white text-lg"
                   [class.border-red-500]="price.invalid && price.touched" />
            <span class="text-sm text-gray-600 font-medium">DT</span>
          </div>
          <div *ngIf="price.invalid && price.touched" class="text-red-600 text-sm mt-1">Price is required.</div>
        </div>
        <div>
          <label class="block font-semibold text-green-700 mb-2">Quantity <span class="text-red-500">*</span></label>
          <input [(ngModel)]="product.quantity" name="quantity" #quantity="ngModel" type="number" min="0" required
                 class="w-full px-4 py-3 rounded-xl shadow-sm border border-green-200 focus:outline-none focus:ring-2 focus:ring-green-400 bg-white text-lg"
                 [class.border-red-500]="quantity.invalid && quantity.touched" />
          <div *ngIf="quantity.invalid && quantity.touched" class="text-red-600 text-sm mt-1">Quantity is required.</div>
        </div>
      </div>

      <!-- Limit Per User -->
      <div>
        <label class="block font-semibold text-green-700 mb-2">Limit Per User</label>
        <input [(ngModel)]="product.limitPerUser" name="limitPerUser" #limit="ngModel" type="number"
               class="w-full px-4 py-3 rounded-xl shadow-sm border border-green-200 focus:outline-none focus:ring-2 focus:ring-green-400 bg-white text-lg"
               [class.border-red-500]="limit.invalid && limit.touched" />
        <div *ngIf="limit.invalid && limit.touched" class="text-red-600 text-sm mt-1">Limit per user is invalid.</div>
      </div>

      <!-- Image Upload -->
      <div>
        <label class="block font-semibold text-green-700 mb-2">Product Image</label>
        <label
          class="flex items-center justify-center w-full px-4 py-3 text-base font-medium text-green-700 bg-white border border-green-300 rounded-xl shadow cursor-pointer hover:bg-green-50 transition"
        >
          📤 Upload Image
          <input
            type="file"
            accept="image/*"
            (change)="onImageSelected($event)"
            class="hidden"
          />
        </label>
        <div *ngIf="product.image" class="mt-4 flex justify-center">
          <img [src]="getProductImageUrl(product.image)"
               class="w-32 h-32 object-cover rounded-xl border border-gray-300 shadow-sm"
               alt="Product Preview"
          />
        </div>
      </div>
<div *ngIf="imageTouched && !product.image" class="text-red-600 text-sm mt-1">
  Please upload a product image.
</div>
      <!-- Description -->
      <div>
        <label class="block font-semibold text-green-700 mb-2">Description</label>
        <textarea [(ngModel)]="product.description" name="description" rows="3" placeholder="Write something..."
                  class="w-full px-4 py-3 rounded-xl shadow-sm border border-green-200 focus:outline-none focus:ring-2 focus:ring-green-400 resize-none bg-white text-lg"></textarea>
      </div>

      <!-- Submit Button -->
      <div class="flex justify-end pt-2">
        <button
  type="submit"
  [disabled]="
    form.invalid ||
    product.name.length < 2 ||
    (product.category !== 'Medical Supplies' && (!product.species || product.species.length === 0)) ||
    !product.image
  "
  class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-xl font-bold shadow-lg text-lg disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
>
  ➕ Add Product
</button>
      </div>
    </form>
  </div>
