<div class="w-full max-w-3xl mx-auto px-10 py-10 bg-green-50 border border-green-100 rounded-3xl shadow-2xl">
    <h2 class="text-3xl font-bold text-green-800 mb-8 text-center">✏️ Edit Pet Species</h2>
  
    <form [formGroup]="speciesForm" (ngSubmit)="submit()" class="space-y-6">
      <div>
        <label class="block text-lg font-semibold text-green-700 mb-2">Name</label>
        <input formControlName="name" type="text"
               class="w-full border-2 border-green-200 p-3 rounded-xl text-green-900 text-lg shadow-md" />
      </div>
  
      <div>
        <label class="block text-lg font-semibold text-green-700 mb-2">Icon URL</label>
        <input formControlName="icon" type="text"
               class="w-full border-2 border-green-200 p-3 rounded-xl text-green-900 text-lg shadow-md" />
      </div>
  
      <div class="text-center">
        <button type="submit" [disabled]="speciesForm.invalid "
                class="bg-green-600 hover:bg-green-700 text-white py-3 px-8 rounded-xl text-lg font-bold shadow-lg transition">
          Save Changes
        </button>
      </div>
    </form>
  </div>
