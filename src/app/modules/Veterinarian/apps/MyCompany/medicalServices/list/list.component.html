<div
  class="w-full max-w-7xl mx-auto px-10 py-14 bg-gradient-to-br from-green-50 via-white to-green-100 border border-green-200 rounded-3xl shadow-2xl backdrop-blur-lg"
>
  <div
    class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-10 gap-6"
  >
    <h2
      class="text-3xl sm:text-4xl font-black text-green-900 tracking-tight flex items-center gap-2 drop-shadow-lg"
    >
      <span
        class="inline-block bg-gradient-to-tr from-green-400 to-green-200 text-white rounded-full px-3 py-1.5 text-2xl shadow-lg"
        >💼</span
      >
      <span
        class="bg-gradient-to-r from-green-700 to-green-400 bg-clip-text text-transparent"
        >Veterinary Services</span
      >
    </h2>
    <!-- Filter Button -->
    <div class="flex gap-4">
      <button
        class="bg-green-600 hover:bg-green-700 text-white px-6 py-3 rounded-full shadow-lg text-lg font-bold flex items-center gap-2"
        (click)="openFilter = !openFilter"
      >
        <mat-icon [svgIcon]="'feather:filter'"></mat-icon>
        Filter
      </button>
      <button
        (click)="add()"
        class="bg-gradient-to-r from-green-700 to-green-500 hover:from-green-800 hover:to-green-600 text-white py-2 px-6 rounded-2xl text-lg font-extrabold shadow-xl focus:outline-none focus:ring-4 focus:ring-green-300 transition-all duration-200 flex items-center gap-2"
      >
        <span class="text-xl">＋</span> Add Service
      </button>
    </div>
  </div>

  <div
    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-10"
  >
    <div
      *ngFor="let service of services"
      class="border-2 rounded-3xl p-8 flex flex-col items-center text-center transition-all duration-300 relative group hover:shadow-2xl hover:scale-[1.04]"
      [ngClass]="{
      'border-green-600 bg-gradient-to-br from-green-100 via-green-50 to-white shadow-2xl scale-105':
        selectedServiceId === service._id && !service.archived,
      'border-green-200 hover:border-green-500 bg-gradient-to-br from-white via-green-50 to-green-100':
        selectedServiceId !== service._id && !service.archived,
      
      'border-red-600 bg-gradient-to-br from-red-200 via-red-50 to-white shadow-2xl scale-105':
        selectedServiceId === service._id && service.archived,
      'border-red-200 hover:border-red-500 bg-gradient-to-br from-white via-red-50 to-red-100':
        selectedServiceId !== service._id && service.archived
      }"
    >
      <div
        class="w-24 h-32 mb-4 flex flex-col items-center justify-center"
      >
        <span
          class="text-base font-extrabold text-green-700 mb-2 tracking-widest uppercase"
          >{{ companyName }}</span
        >
        <img
          src="assets/images/logo/vet-cross-with-paw.jpeg"
          class="w-full h-full object-contain rounded-2xl shadow-lg border-2 border-green-100"
          alt="Veterinary cross with paw logo"
        />
      </div>

      <span class="font-bold text-green-900 text-xl mb-1 tracking-tight">{{
        service.name
      }}</span>
      <span
        class="text-lg text-green-700 font-semibold mb-3 flex items-center gap-1"
      >
        {{ service.price }}
        <span class="text-xs text-green-400 font-medium">TND</span>
      </span>

      <div
        class="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity"
      >
        <button
          (click)="editService(service)"
          class="text-green-700 hover:text-green-900 bg-white rounded-full p-2 shadow-lg focus:outline-none border border-green-100 hover:bg-green-50 transition"
          title="Edit"
        >
          <span class="sr-only">Edit</span>
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              d="M15.232 5.232l3.536 3.536M9 13l6-6M3 21h18"
            ></path>
          </svg>
        </button>
        <button
          (click)="archiveService(service)"
          class="text-red-600 hover:text-red-800 bg-white rounded-full p-2 shadow-lg focus:outline-none border border-red-100 hover:bg-red-50 transition"
          title="Delete"
        >
          <span class="sr-only">Delete</span>
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <path
              d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 7V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v2"
            ></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div
    class="mt-12 w-full rounded-3xl border border-green-200 bg-gradient-to-r from-green-50 to-white shadow-xl p-7 flex justify-center"
  >
    <mat-paginator
      class="w-full"
      [length]="total"
      [pageSize]="currentSize"
      [pageIndex]="currentPage - 1"
      [pageSizeOptions]="[5, 10, 20]"
      (page)="pageChanged($event)"
    >
    </mat-paginator>
  </div>
</div>
<!-- Sidebar Filter Panel -->
<div
  class="fixed top-0 right-0 h-full w-80 max-w-full z-50 bg-white shadow-2xl transition-transform duration-300"
  [class.translate-x-0]="openFilter"
  [class.translate-x-full]="!openFilter"
  style="transform: translateX(100%)"
>
  <div
  class="flex items-center justify-between px-6 py-4 border-b border-green-200 bg-green-50"
  >
  <span class="text-lg font-bold text-green-700">Filters</span>
  <button mat-icon-button (click)="openFilter = false">
    <mat-icon [svgIcon]="'heroicons_outline:x-circle'"></mat-icon>
  </button>
  </div>
  <div class="flex flex-col gap-6 p-6 overflow-y-auto h-[calc(100%-4rem)]">
  <!-- Archive Filter -->
  <div>
    <div class="font-semibold text-base mb-2 flex items-center gap-2">
    <mat-icon [svgIcon]="'feather:archive'"></mat-icon>
    Archive Status
    </div>
    <mat-form-field class="w-full" appearance="fill">
    <mat-select
      [(ngModel)]="filterArchived"
      name="filterArchived"
      placeholder="Select status"
    >
      <mat-option value="">All</mat-option>
      <mat-option [value]="false">Active</mat-option>
      <mat-option [value]="true">Archived</mat-option>
    </mat-select>
    </mat-form-field>
  </div>
  <!-- Price Filter -->
  <div>
    <div class="font-semibold text-base mb-2 flex items-center gap-2">
    <mat-icon [svgIcon]="'feather:dollar-sign'"></mat-icon>
    Price Range
    </div>
    <div class="flex gap-2">
    <mat-form-field class="w-1/2" appearance="fill">
      <mat-label>Min</mat-label>
      <input
      matInput
      type="number"
      [(ngModel)]="filterPriceMin"
      name="filterPriceMin"
      
      min="0"
      />
    </mat-form-field>
    <mat-form-field class="w-1/2" appearance="fill">
      <mat-label>Max</mat-label>
      <input
      matInput
      type="number"
      [(ngModel)]="filterPriceMax"
      name="filterPriceMax"
      min="0"
      />
    </mat-form-field>
    </div>
  </div>
  <!-- Actions -->
  <div class="flex gap-2 mt-4">
    <button
    mat-stroked-button
    color="primary"
    class="flex-1"
    (click)="applyFilters()"
    >
    <mat-icon class="mr-1" [svgIcon]="'feather:filter'"></mat-icon>
    Apply
    </button>
    <button
    mat-stroked-button
    color="warn"
    class="flex-1"
    (click)="resetFilters()"
    >
    <mat-icon
      class="mr-1"
      [svgIcon]="'feather:rotate-ccw'"
    ></mat-icon>
    Reset
    </button>
  </div>
  </div>
</div>
