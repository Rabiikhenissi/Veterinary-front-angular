<div class="max-w-7xl w-full mx-auto p-6 bg-green-50 rounded-xl shadow-lg border border-green-100">
  <h2 class="text-2xl font-bold text-green-700 mb-6">🆕 Add New Product</h2>
  <form #form="ngForm" (ngSubmit)="addProduct()" class="space-y-4" novalidate>
    
    <!-- Name -->
    <label class="block font-medium text-green-800 mb-1">Product Name*</label>
    <input [(ngModel)]="product.name" name="name" #name="ngModel" required
           class="w-full p-2 border rounded-md focus:ring-2 ring-green-300 bg-white"
           [class.border-red-500]="name.invalid && name.touched" />
    <div *ngIf="name.invalid && name.touched" class="text-red-600 text-sd">Product name is required.</div>

    <mat-form-field appearance="fill" class="w-full">
      <mat-label class="text-green-800 font-medium">📂 Category</mat-label>
      <mat-select
        [(ngModel)]="product.category"
        name="category"
        #category="ngModel"
        (selectionChange)="onCategoryChange()"
        required
        [disableRipple]="true"
      >
        <mat-option value="" disabled>Select Category</mat-option>
        <mat-option *ngFor="let cat of categories" [value]="cat">
          {{ cat }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="category.invalid && category.touched">
        Category is required.
      </mat-error>
    </mat-form-field>
    
    <!-- Species -->
    <div *ngIf="product.category !== 'Medical Supplies'">
      <label class="block font-medium text-green-800 mb-1">Species</label>
      <div class="grid grid-cols-[repeat(auto-fit,minmax(120px,1fr))] gap-4">
        <div *ngFor="let sp of speciesOptions"
             class="flex flex-col items-center cursor-pointer p-3 rounded-xl border-2 transition-all duration-300 ease-in-out shadow-sm hover:shadow-md bg-white"
             [class.border-green-500]="product.species?.includes(sp.name)"
             (click)="selectSpecies(sp.name)">
          <img [src]="sp.icon" [alt]="sp.name" class="w-16 h-16 mb-1 object-cover rounded" />
          <span class="text-sd font-medium text-green-700">{{ sp.name }}</span>
        </div>
      </div>
    </div>

    <!-- Price -->
    <label class="block font-medium text-green-800 mb-1">Price*</label>
    <div class="flex items-center space-x-2">
    <input [(ngModel)]="product.price" name="price" #price="ngModel" type="number" step="0.1" required
           class="w-full p-2 border rounded-md focus:ring-2 ring-green-300 bg-white "
           [class.border-red-500]="price.invalid && price.touched" />
           <span class="text-sm text-gray-600 font-medium">DT</span>
    </div>
    <div *ngIf="price.invalid && price.touched" class="text-red-600 text-md">Price is required.</div>

    <!-- Quantity -->
    <label class="block font-medium text-green-800 mb-1">Quantity*</label>
    <input [(ngModel)]="product.quantity" name="quantity" #quantity="ngModel" type="number" min="0" required
           class="w-full p-2 border rounded-md focus:ring-2 ring-green-300 bg-white"
           [class.border-red-500]="quantity.invalid && quantity.touched" />
    <div *ngIf="quantity.invalid && quantity.touched" class="text-red-600 text-sd">Quantity is required.</div>

    <!-- Limit Per User -->
    <label class="block font-medium text-green-800 mb-1">Limit Per User*</label>
    <input [(ngModel)]="product.limitPerUser" name="limitPerUser" #limit="ngModel" type="number" min="0" required
           class="w-full p-2 border rounded-md focus:ring-2 ring-green-300 bg-white"
           [class.border-red-500]="limit.invalid && limit.touched" />
    <div *ngIf="limit.invalid && limit.touched" class="text-red-600 text-sd">Limit per user is required.</div>

    <!-- Image Upload -->
<div>
  <label class="block font-medium text-green-800 mb-1">📷 Product Image</label>

  <!-- Styled Upload Button -->
  <label
    class="flex items-center justify-center w-full px-4 py-2 text-sm font-medium text-green-700 bg-white border border-green-300 rounded-md shadow cursor-pointer hover:bg-green-50 transition"
  >
    📤 Upload Image
    <input
      type="file"
      accept="image/*"
      (change)="onImageSelected($event)"
      class="hidden"
    />
  </label>

  <!-- Image Preview -->
  <div *ngIf="product.image" class="mt-4">
    <img
      [src]="product.image"
      class="w-32 h-32 object-cover rounded border border-gray-300 shadow-sm"
      alt="Product Preview"
    />
  </div>
</div>


    <!-- Description -->
    <label class="block font-medium text-green-800 mb-1">Description</label>
    <textarea [(ngModel)]="product.description" name="description" rows="3" placeholder="Write something..."
              class="w-full p-2 border rounded-md focus:ring-2 ring-green-300 resize-none bg-white"></textarea>

    <!-- Submit Button -->
    <button type="submit" [disabled]="form.invalid"
            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md font-semibold shadow disabled:opacity-50 disabled:cursor-not-allowed">
      ➕ Add Product
    </button>
  </form>
</div>
