<div class="max-w-7xl w-full mx-auto p-6 bg-green-50 rounded-xl shadow-lg border border-green-100">
    <h2 class="text-2xl font-bold text-green-700 mb-6">🆕 Add New Product</h2>
    <form (ngSubmit)="addProduct()" class="space-y-4">
   <!-- Code-->
   <label class="block font-medium text-green-800 mb-1">Product Code</label>
   <input [(ngModel)]="product.code" name="code" placeholder="Product Code" required
          class="w-full p-2 border rounded-md focus:ring-2 ring-green-300" />
      <!-- Name -->
      <label class="block font-medium text-green-800 mb-1">Product Name</label>
      <input [(ngModel)]="product.name" name="name" placeholder="Product Name" required
             class="w-full p-2 border rounded-md focus:ring-2 ring-green-300" />
  
      <!-- Category -->
      <label class="block font-medium text-green-800 mb-1">Category</label>
      <select [(ngModel)]="product.category" name="category" (change)="onCategoryChange()"
              required class="w-full p-2 border rounded-md bg-white text-gray-700">
        <option value="" disabled selected>Select Category</option>
        <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
      </select>
  
      <!-- Species -->
      <div *ngIf="product.category !== 'Medical Supplies'">
        <label class="block font-medium text-green-800 mb-1">Species</label>
        <div class="grid grid-cols-[repeat(auto-fit,minmax(120px,1fr))] gap-4">
          <div
            *ngFor="let sp of speciesOptions"
            class="flex flex-col items-center cursor-pointer p-3 rounded-xl border-2 transition-all duration-300 ease-in-out shadow-sm hover:shadow-md bg-white"
            [class.border-green-500]="product.species?.includes(sp.name)"
            (click)="selectSpecies(sp.name)"
          >
            <img [src]="sp.image" [alt]="sp.name" class="w-16 h-16 mb-1 object-cover rounded" />
            <span class="text-sm font-medium text-green-700">{{ sp.name }}</span>
          </div>
        </div>
      </div>
  
      <!-- Price -->
        <label class="block font-medium text-green-800 mb-1">Price</label>
      <input [(ngModel)]="product.price" name="price" type="number" step="0.1" placeholder="Price (TND)"
             required class="w-full p-2 border rounded-md focus:ring-2 ring-green-300" />
  
      <!-- Quantity -->
        <label class="block font-medium text-green-800 mb-1">Quantity</label>
      <input [(ngModel)]="product.quantity" name="quantity" type="number" min="0" placeholder="Quantity"
             required class="w-full p-2 border rounded-md focus:ring-2 ring-green-300" />
  
      <!-- Image Upload -->
      <div>
        <label class="block font-medium text-green-800 mb-1">Product Image</label>
        <input type="file" (change)="onImageSelected($event)" accept="image/*"
               class="w-full border p-2 rounded-md bg-white" />
        <div *ngIf="product.image" class="mt-2">
          <img [src]="product.image" class="w-32 h-32 object-cover rounded border" />
        </div>
      </div>
      <label class="block font-medium text-green-800 mb-1">Description</label>
      <textarea [(ngModel)]="product.description" name="description" rows="3" placeholder="Write something..."
                class="w-full p-2 border rounded-md focus:ring-2 ring-green-300 resize-none"></textarea>
      <button type="submit"
              class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-md font-semibold shadow">
        ➕ Add Product
      </button>
    </form>
  </div>
