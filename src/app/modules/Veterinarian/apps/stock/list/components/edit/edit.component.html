<div
    class="max-w-7xl w-full mx-auto p-6 bg-green-50 rounded-xl shadow-lg border border-green-100"
>
    <form (ngSubmit)="onSubmit()" class="flex flex-col lg:flex-row gap-12">
        <!-- Image Preview + Upload -->
        <div class="lg:w-[40%] w-full space-y-4">
            <img
                [src]="product.image"
                alt="{{ product.name }}"
                class="w-full h-[420px] object-cover rounded-xl border border-gray-300 shadow-sm"
            />

            <label
  class="flex items-center justify-center w-full px-4 py-2 text-sm font-medium text-green-700 bg-white border border-green-300 rounded-md shadow cursor-pointer hover:bg-green-50 transition"
>
  📤 Upload Image
  <input
    type="file"
    accept="image/*"
    (change)="onFileSelected($event)"
    class="hidden"
  />
</label>

        </div>

        <!-- Product Form -->
        <div
            class="lg:w-[60%] w-full flex flex-col justify-between space-y-8 text-gray-900"
        >
            <!-- Basic Info -->
            <div>
                <input
                    type="text"
                    [(ngModel)]="product.name"
                    name="name"
                    required
                    placeholder="Product Name"
                    class="text-5xl font-extrabold tracking-tight mb-6 w-full bg-transparent border-b border-green-300 focus:outline-none focus:border-green-500"
                />

                <div
                    class="grid grid-cols-1 sm:grid-cols-2 gap-y-4 gap-x-12 text-lg"
                >
                    <!-- Category -->
<div>
    <label class="block font-semibold text-green-800 mb-2">📂 Category</label>
    <select
      [(ngModel)]="product.category"
      name="category"
      class="w-full border border-green-300 rounded-md px-4 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-green-500 transition"
    >
      <option value="" disabled selected>Select Category</option>
      <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
    </select>
  </div>
  

                    <!-- Species Multi-select -->
                    <div>
                        <label class="block font-semibold mb-1"
                            >🐾 Species</label
                        >
                        <div class="flex flex-wrap items-center gap-3 mt-2">
                            <div
                                *ngFor="let spec of species"
                                (click)="toggleSpecies(spec.name)"
                                class="cursor-pointer flex items-center gap-2 px-3 py-1 rounded-lg border border-gray-300 shadow bg-white transition"
                                [ngClass]="{
                                    'ring-2 ring-green-400':
                                        product.species?.includes(spec.name)
                                }"
                            >
                                <img
                                    [src]="spec.icon"
                                    alt="{{ spec.name }}"
                                    class="w-8 h-8 object-contain rounded-full"
                                />
                                <span>{{ spec.name }}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Quantity -->
                    <div>
                        <label class="block font-semibold mb-1"
                            >📦 Quantity</label
                        >
                        <input
                            type="number"
                            min="0"
                            [(ngModel)]="product.quantity"
                            name="quantity"
                            class="w-full border border-green-200 rounded-md px-4 py-2 shadow-sm"
                        />
                    </div>
                    <!-- Limit -->
                    <div>
                        <label class="block font-semibold mb-1">📉 Limit per user</label>
                        <input
                            type="number"
                            min="0"
                            [(ngModel)]="product.limitPerUser"
                            name="limitPerUser"
                            class="w-full border border-green-200 rounded-md px-4 py-2 shadow-sm"
                        />
                    </div>

                    <!-- Price -->
                    <div>
                        <label class="block font-semibold mb-1">💰 Price (TND)</label>
                        <div class="relative">
                            <input
                                type="number"
                                step="0.01"
                                min="0"
                                [(ngModel)]="product.price"
                                name="price"
                                class="w-full border border-green-200 rounded-md px-4 py-2 pr-16 shadow-sm"
                            />
                            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">TND</span>
                        </div>
                    </div>

                    <!-- Expiration Date -->
                    <div class="sm:col-span-2">
                        <label class="block font-semibold mb-1"
                            >⏳ Expiration Date</label
                        >
                        <input
                            type="date"
                            [(ngModel)]="product.expirationDate"
                            name="expirationDate"
                            class="w-full border border-green-200 rounded-md px-4 py-2 shadow-sm"
                        />
                    </div>
                </div>
            </div>

            <!-- Description -->
            <div>
                <label class="block font-semibold text-2xl mb-2"
                    >📝 Description</label
                >
                <textarea
                    [(ngModel)]="product.description"
                    name="description"
                    rows="4"
                    class="w-full border border-green-200 rounded-md px-4 py-2 shadow-sm text-base leading-relaxed"
                ></textarea>
            </div>

            <!-- Actions -->
            <div class="flex justify-end gap-4">
                <button
                    type="button"
                    (click)="cancel()"
                    class="px-6 py-3 rounded-md bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 shadow"
                >
                    ❌ Cancel
                </button>
                <button
                    type="submit"
                    class="px-6 py-3 rounded-md bg-green-600 hover:bg-green-700 text-white shadow"
                >
                    💾 Save Changes
                </button>
            </div>
        </div>
    </form>
</div>
