<ng-container *ngIf="!isLoading; else loading">
<!-- Navigation -->
<fuse-vertical-navigation
   class="bg-gradient-to-b from-green-900 via-green-800 to-green-600 text-white shadow-lg print:hidden "
    [mode]="isScreenSmall ? 'over' : 'side'"
    [name]="'mainNavigation'"
    [navigation]="navigation"
    [opened]="!isScreenSmall"
>
   <!-- Navigation header hook -->
  <ng-container fuseVerticalNavigationContentHeader>
    <div
      class="flex items-center justify-between w-full px-4 py-2"
      style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;"
    >
      <!-- Left: ZooVana with styling -->
      <div
        style="
          font-weight: 700;
          font-size: 1.5rem;
          color: #A3E635; /* bright lime-green */
          text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);
          letter-spacing: 0.05em;
          font-style: italic;
        "
      >
        ZooVana
      </div>

      <!-- Right: Notifications with margin-left auto to push right -->
      <notifications style="margin-left: auto;"></notifications>
    </div>
  </ng-container>
    <!-- Navigation footer hook -->
    <ng-container fuseVerticalNavigationContentFooter>
        <div
            class="flex flex-0 items-center justify-center h-16 pr-6 pl-2 mt-8 mb-2 opacity-50 mx-auto"
        ></div>
    </ng-container>
</fuse-vertical-navigation>

<!-- Wrapper -->
<div class="flex flex-col flex-auto w-full min-w-0">
    <!-- Header -->
    <div
        class="relative flex flex-0 items-center w-full h-16 px-4 md:px-6 z-49 shadow dark:shadow-none dark:border-b bg-card dark:bg-transparent print:hidden"
    >
        <!-- Navigation toggle button -->
        <button mat-icon-button (click)="toggleNavigation('mainNavigation')">
            <mat-icon svgIcon="heroicons_outline:bars-3"></mat-icon>
        </button>

        <app-breadcrumbs></app-breadcrumbs>

        <ng-template #separatorTemplate>
            <mat-icon svgIcon="heroicons_outline:chevron-right"></mat-icon>
        </ng-template>

        <!-- Right-side header components -->
        <div class="flex items-center pl-2 ml-auto space-x-0.5 sm:space-x-2">
           
        </div>
    </div>

    <!-- Content -->
    <div class="flex flex-col flex-auto">
        @if (true) {
            <router-outlet></router-outlet>
        }
    </div>
</div>
</ng-container>
<!-- Loading Placeholder -->
<ng-template #loading>
    <div class="flex items-center justify-center h-screen w-full">
        <mat-spinner diameter="48" color="primary"></mat-spinner>
    </div>
</ng-template>
